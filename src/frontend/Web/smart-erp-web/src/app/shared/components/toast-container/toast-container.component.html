<div class="toast-stack" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts(); track toast.id) {
    <article class="toast" [class]="'toast toast--' + toast.type" role="status">
      <span class="toast__icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ! }
          @case ('warning') { ! }
          @default { i }
        }
      </span>

      <p>{{ toast.message }}</p>

      <button
        type="button"
        class="toast__close"
        [attr.aria-label]="translation.t('labels', 'close')"
        (click)="toastService.dismiss(toast.id)"
      >
        ×
      </button>
    </article>
  }
</div>
